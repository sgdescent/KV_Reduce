name: CI
on:
  push:
    branches: [main, release/axiom-paper]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  results:
    name: Released results and launchers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU analysis and plotting dependencies
        run: python -m pip install -r requirements-plots.txt
      - name: Reproduce the frozen AXIOM review summaries
        run: python -m kv_reduce.analysis.analyze_axiom_review --check
      - name: Verify the raw archive and rebuilt metrics
        run: python -m unittest discover -s tests -p 'test_axiom_raw_archive.py' -v
      - name: Test pairing checks and portable launchers
        run: python -m unittest discover -s tests -p 'test_axiom_review_release.py' -v
      - name: Recreate the Appendix E figures from raw outputs
        run: python -m kv_reduce.analysis.plot_axiom_review
      - name: Check launcher syntax
        run: find scripts \( -name '*.sh' -o -name '*.slurm' \) -print0 | xargs -0 -n1 bash -n
      - name: Check Python syntax
        run: python -m compileall -q kv_reduce tests

  tests:
    name: Unit tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.3.0 numpy matplotlib pytest
      - name: Run tests
        run: python -m pytest -q
