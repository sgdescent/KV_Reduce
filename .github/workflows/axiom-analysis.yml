name: AXIOM result validation
on:
  push:
    branches: [main, release/axiom-paper]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU analysis and plotting dependencies
        run: python -m pip install -r requirements-plots.txt
      - name: Validate published results
        run: python analyze_axiom_review.py --check
      - name: Verify raw archive and reconstruction
        run: python -m unittest discover -s tests -p 'test_axiom_raw_archive.py' -v
      - name: Test pairing checks and portable launchers
        run: python -m unittest discover -s tests -p 'test_axiom_review_release.py' -v
      - name: Recreate plots from raw outputs
        run: python plot_axiom_review.py
      - name: Check shell syntax
        run: bash -n scripts/axiom/quality.sh scripts/axiom/packed.sh scripts/axiom/review.slurm
      - name: Check Python syntax
        run: python -m py_compile analyze_axiom_review.py benchmark_spec_kv_quantization.py packed_review.py
